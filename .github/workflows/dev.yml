name: Build dev image

# Maintainer pre-prod channel. Every push to `dev` (i.e. a merged feature
# branch) runs the full test suite and, only if green, builds and publishes
# the mutable `:dev` image to GHCR. Point a staging container at `:dev` to
# validate a change in a real deployment BEFORE promoting it to main/prod.
#
# `:dev` is for the maintainer only — production pins an immutable `:vX.Y.Z`
# tag (see build.yml + README). A unique APP_VERSION per commit busts the
# service-worker cache so the staging PWA always serves the fresh build.

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  # Same gate as the release workflow: a red suite blocks the :dev image.
  tests:
    uses: ./.github/workflows/test.yml

  publish-dev:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push :dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          # Mutable :dev (staging always pulls newest) + an immutable
          # :dev-<sha> for traceability / quick rollback on staging.
          # Mirrored to GHCR + Docker Hub so both registries stay in sync.
          tags: |
            ghcr.io/${{ github.repository_owner }}/pocketlog:dev
            ghcr.io/${{ github.repository_owner }}/pocketlog:dev-${{ steps.sha.outputs.short }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pocketlog:dev
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pocketlog:dev-${{ steps.sha.outputs.short }}
          build-args: |
            APP_VERSION=dev-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
